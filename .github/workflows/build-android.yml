name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'input/**/*.zip'
      - 'input/*.zip'
  workflow_dispatch:
    inputs:
      project_zip_path:
        description: 'Path to the Android project ZIP in this repository'
        required: true
        default: 'input/project.zip'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android project ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify uploaded project ZIP
        id: zip
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_ZIP_PATH: ${{ inputs.project_zip_path }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ZIP_PATH="$MANUAL_ZIP_PATH"
          else
            ZIP_PATH="$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- 'input/*.zip' 'input/**/*.zip' | head -n 1 || true)"
          fi

          if [[ -z "$ZIP_PATH" || ! -f "$ZIP_PATH" ]]; then
            echo "::error::No uploaded project ZIP found. Add one ZIP under input/ and commit it to main."
            exit 1
          fi

          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Selected project: $ZIP_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Safely extract and validate Android project
        shell: bash
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-project"

          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive = os.environ["ZIP_PATH"]
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "android-project"
          max_total = 2 * 1024 * 1024 * 1024
          total = 0
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP entry path: {name}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlinks are not allowed in project ZIPs: {name}")
                  total += info.file_size
                  if total > max_total:
                      raise SystemExit("ZIP expands beyond the 2 GiB safety limit.")
              zf.extractall(destination)
          print(f"Extracted project to {destination}")
          PY

          WRAPPER="$(find "$RUNNER_TEMP/android-project" -type f -name gradlew -print -quit)"
          if [[ -z "$WRAPPER" ]]; then
            echo "::error::ZIP must contain a complete Gradle project including gradlew and gradle/wrapper/."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" && ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "::error::settings.gradle or settings.gradle.kts is missing beside gradlew."
            exit 1
          fi
          if [[ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-output"
          count=0

          while IFS= read -r -d '' APK; do
            relative="${APK#"$PROJECT_DIR"/}"
            safe_name="$(printf '%s' "$relative" | tr '/' '-')"
            cp "$APK" "$RUNNER_TEMP/apk-output/$safe_name"
            count=$((count + 1))
          done < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print0)

          if [[ "$count" -eq 0 ]]; then
            echo "::error::Build completed but no debug APK was found."
            exit 1
          fi

          echo "Collected $count APK file(s):"
          ls -lh "$RUNNER_TEMP/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
