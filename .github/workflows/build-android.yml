name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'input/**/*.zip'
      - 'input/*.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      project_zip_path:
        description: 'Path to the Android project ZIP in this repository'
        required: true
        default: 'input/project.zip'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android project ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose ZIP path
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ZIP_PATH="${{ inputs.project_zip_path }}"
          else
            ZIP_PATH="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep -E '^input/.*\.zip$' | head -n 1 || true)"
            if [[ -z "$ZIP_PATH" ]]; then
              ZIP_PATH="$(find input -maxdepth 2 -type f -name '*.zip' -print -quit 2>/dev/null || true)"
            fi
          fi
          if [[ -z "$ZIP_PATH" || ! -f "$ZIP_PATH" ]]; then
            echo "::error::No project ZIP found. Add an Android project ZIP under input/."
            exit 1
          fi
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Building: $ZIP_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "${{ steps.zip.outputs.path }}" -d "$RUNNER_TEMP/android-project"
          WRAPPER="$(find "$RUNNER_TEMP/android-project" -type f -name gradlew -print -quit)"
          if [[ -z "$WRAPPER" ]]; then
            echo "::error::ZIP must contain a complete Gradle project including gradlew and gradle/wrapper/."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" && ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "::error::settings.gradle or settings.gradle.kts is missing beside gradlew."
            exit 1
          fi
          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: assembleDebug --stacktrace

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-output"
          mapfile -t APK_FILES < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk')
          if [[ "${#APK_FILES[@]}" -eq 0 ]]; then
            echo "::error::Build finished but no debug APK was found."
            exit 1
          fi
          for APK in "${APK_FILES[@]}"; do
            MODULE="$(basename "$(dirname "$(dirname "$(dirname "$APK")")")")"
            cp "$APK" "$RUNNER_TEMP/apk-output/${MODULE}-$(basename "$APK")"
          done
          ls -lh "$RUNNER_TEMP/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
